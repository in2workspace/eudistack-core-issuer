# components.schemas of the Attestation Catalogue API contract, copied verbatim so that the
# "#/components/schemas/..." references resolve untouched. Used by the catalog ITs to validate real
# responses (OpenAPI 3.1 = JSON Schema 2020-12); see ContractSchemas.
#
# Source: eudistack-platform-dev/docs/features/EUD-169-catalogo-atestaciones/annex/openapi.yaml
# (platform-dev commit 9dfc8fa, lines 288-389). Refresh it from there when the contract changes.
components:
  schemas:
    ClaimPath:
      type: array
      description: Path to an attribute, as in OID4VCI `claims.path`.
      minItems: 1
      items: { type: string }
      examples: [[mandate, mandatee, firstName]]

    AttestationSchema:
      type: object
      required: [schema_uri, attestation_type, version, format, owner, binding_type, attributes, configured]
      properties:
        schema_uri: { type: string, format: uri, description: Persistent URI of the format specific schema (TS11 §4.3.2). }
        attestation_type: { type: string }
        version: { type: string }
        format: { type: string, enum: [dc+sd-jwt, mso_mdoc, jwt_vc_json, jwt_vc_json-ld, ldp_vc] }
        owner: { type: string, description: "`eudistack` for base types, or the owning tenant." }
        binding_type:
          type: string
          enum: [key, none, claim, biometric]
          description: Holder binding the type requires. Only `key` and `none` can be configured.
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ClaimPath" }
        configured: { type: boolean, description: Whether the tenant already has a catalogue entry for this schema. }

    CatalogEntryConfiguration:
      type: object
      required: [enabled, delivery_modes, validity]
      properties:
        enabled: { type: boolean }
        delivery_modes:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { type: string, enum: [email, ui, direct] }
        validity:
          type: object
          required: [default_days, requester_can_set_dates]
          additionalProperties: false
          properties:
            default_days: { type: integer, minimum: 1 }
            requester_can_set_dates: { type: boolean }
            max_days: { type: integer, minimum: 1, description: Required when the requester can set dates. }
        subject:
          type: object
          required: [fields]
          additionalProperties: false
          properties:
            fields:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/ClaimPath" }
            separator: { type: string, default: " " }
        search_identifiers:
          type: array
          items:
            type: object
            required: [name, field]
            additionalProperties: false
            properties:
              name: { type: string, pattern: "^[a-z0-9_]{1,50}$" }
              field: { $ref: "#/components/schemas/ClaimPath" }

    CatalogEntryCreate:
      unevaluatedProperties: false
      allOf:
        - type: object
          required: [schema_uri]
          properties:
            schema_uri: { type: string, format: uri }
        - $ref: "#/components/schemas/CatalogEntryConfiguration"

    CatalogEntry:
      allOf:
        - type: object
          required: [credential_configuration_id, schema_uri, created, updated]
          properties:
            credential_configuration_id: { type: string, description: "Generated by the issuer from type, version and format." }
            schema_uri: { type: string, format: uri }
            created: { type: string, format: date-time }
            updated: { type: string, format: date-time }
        - $ref: "#/components/schemas/CatalogEntryConfiguration"

    Problem:
      type: object
      description: Problem details (RFC 9457 shape). `type` is an error code.
      required: [type, title, status]
      properties:
        type: { type: string, description: Error code. The codes of each HTTP status are listed in its response. }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

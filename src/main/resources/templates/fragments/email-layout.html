<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Shared layout of the transactional emails (header / footer). Brand-specific items come from the
  `branding` variable (EmailBranding); colours are common to all tenants.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Email</title>
    <!-- Gmail and Outlook desktop ignore web fonts: the Arial fallback is expected there. -->
    <link href="https://fonts.googleapis.com/css2?family=Blinker:wght@400;600;700&amp;display=swap" rel="stylesheet" />
    <style>
        @media (max-width: 480px) {
            .email-box { width: 100% !important; }
        }
    </style>
</head>
<body>

<!-- HEADER: logo on a white background; DOME adds a background image with its own shape in the top-left corner. -->
<tr th:fragment="header(branding)">
    <td align="center" bgcolor="#ffffff"
        th:attr="background=${branding.headerBackgroundUrl}"
        th:style="'padding: 28px 24px 12px 24px; background-color: #ffffff; background-image: url(' + ${branding.headerBackgroundUrl} + '); background-repeat: no-repeat; background-position: top left;'"
        style="padding: 28px 24px 12px 24px; background-color: #ffffff;">
        <img th:src="${branding.logoUrl}"
             th:alt="${#strings.isEmpty(tenantDisplayName) ? 'EUDIStack' : tenantDisplayName}"
             alt="EUDIStack" height="48"
             style="display: block; margin: 0 auto; height: 48px; border: 0;" />
    </td>
</tr>

<!-- FOOTER: divider, per-template text (a fragment, may contain links) and optional social icons. -->
<tr th:fragment="footer(branding, text)">
    <td align="center" style="padding: 8px 40px 32px 40px; font-family: 'Blinker', Arial, Helvetica, sans-serif; text-align: center;">
        <table role="presentation" width="66%" align="center" cellspacing="0" cellpadding="0" border="0" style="width: 66%; margin: 0 auto;">
            <tr>
                <td height="1" style="border-top: 2px solid #B6CAEC; font-size: 1px; line-height: 1px;">&nbsp;</td>
            </tr>
        </table>
        <p style="margin: 20px 0 0 0; font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.6; color: #6B7A99; text-align: center;">
            <th:block th:replace="${text}"></th:block>
        </p>
        <table role="presentation" align="center" cellspacing="0" cellpadding="0" border="0"
               th:if="${!#lists.isEmpty(branding.socialLinks)}" style="margin: 20px auto 0 auto;">
            <tr>
                <td th:each="link : ${branding.socialLinks}" style="padding: 0 6px;">
                    <a th:href="${link.url}" target="_blank" rel="noopener noreferrer">
                        <img th:src="${link.iconUrl}" th:alt="${link.type}" alt="social" width="32" height="32"
                             style="display: block; width: 32px; height: 32px; border: 0; border-radius: 50%;" />
                    </a>
                </td>
            </tr>
        </table>
    </td>
</tr>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/email-layout :: head(title=#{email.tx-code.subject})}">
    <title>Your Activation Code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f4f9; font-family: 'Blinker', Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f1f4f9;">
    <tr>
        <td align="center" style="padding: 24px 10px;">
            <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 640px; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
                <tr th:replace="~{fragments/email-layout :: header(${branding})}"></tr>

                <!-- CONTENT -->
                <tr>
                    <td align="center" style="padding: 24px 40px 32px 40px; font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #0F2B5B; text-align: center;">
                        <p style="margin: 0 0 8px 0;" th:text="#{email.tx-code.greeting}">Hello,</p>
                        <p style="margin: 0 0 24px 0; font-size: 24px; font-weight: 700;" th:text="#{email.tx-code.body}">Your Activation Code</p>

                        <!-- ACTIVATION CODE -->
                        <table role="presentation" class="email-box" width="450" align="center" cellspacing="0" cellpadding="0" border="0"
                               style="width: 100%; max-width: 450px; margin: 0 auto;">
                            <tr>
                                <td align="center" style="padding: 22px 16px; background-color: #EBF0F7; border: 1px solid #8EACE1; border-radius: 16px;">
                                    <span style="font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #0F2B5B;" th:text="${txCode}">1234</span>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 24px 0 0 0; font-size: 14px; color: #6B7A99;" th:text="#{email.tx-code.hint}">Please enter this activation code in your Wallet App.</p>
                    </td>
                </tr>

                <tr th:replace="~{fragments/email-layout :: footer(${branding}, ~{::footerText})}">
                    <td>
                        <span th:fragment="footerText" th:text="#{email.tx-code.footer}">If you did not request this code, please ignore this email.</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

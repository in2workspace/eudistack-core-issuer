<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/email-layout :: head(title=${title})}">
    <title>[title]</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: 'Blinker', Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff;">
    <tr>
        <td align="center" style="padding: 24px 10px;">
            <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 640px; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
                <tr th:replace="~{fragments/email-layout :: header(${branding}, #{email.revoked-expired.greeting}, 'font-size: 18px; line-height: 1.5; margin-bottom: 16px;')}"></tr>

                <!-- CONTENT -->
                <tr>
                    <td align="center" style="padding: 12px 40px 140px 40px; font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #000000; text-align: center;">
                        <th:block th:if="${statusKeyPrefix != null}">
                            <!-- Only the status word is coloured; the sentence is split in three keys so each language can reorder it. -->
                            <p style="margin: 0 0 16px 0; font-size: 14px; font-weight: 700; line-height: 1.3;">
                                <span th:text="#{${statusKeyPrefix + '.sentence-before'}} + ' '">Your credential has been</span><span
                                        th:style="'color: ' + ${statusWordColor} + ';'"
                                        th:text="#{${statusKeyPrefix + '.sentence-word'}}">revoked</span><span
                                        th:text="#{${statusKeyPrefix + '.sentence-after'}}">.</span>
                            </p>
                            <p style="margin: 0 0 24px 0; font-size: 14px; font-weight: 400;"
                               th:text="#{${statusKeyPrefix + '.details'}}">
                                Details regarding the revoked credential are listed below:
                            </p>

                            <!-- CREDENTIAL DETAILS -->
                            <table role="presentation" class="email-box" width="450" align="center" cellspacing="0" cellpadding="0" border="0"
                                   style="width: 100%; max-width: 450px; margin: 0 auto;">
                                <tr>
                                    <td align="center" style="padding: 22px 16px; background-color: #EBF0F7; border: 1px solid #8EACE1; border-radius: 16px; font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 16px; color: #000000;">
                                        <span th:style="'display: inline-block; margin: 0 0 16px 0; padding: 6px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; background-color: ' + ${badgeBackground} + '; color: ' + ${badgeTextColor} + ';'"
                                              th:text="#{${statusKeyPrefix + '.badge'}}">Credential revoked</span>
                                        <p style="margin: 0 0 8px 0;">
                                            <span style="font-weight: 700;"><span th:text="#{email.revoked-expired.credential-id}">Credential ID</span>:</span>
                                            <span th:text="${credentialId}">[credentialId]</span>
                                        </p>
                                        <p style="margin: 0;">
                                            <span style="font-weight: 700;"><span th:text="#{email.revoked-expired.type}">Type</span>:</span>
                                            <span th:text="${type}">[type]</span>
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </th:block>
                    </td>
                </tr>

                <tr th:replace="~{fragments/email-layout :: footer(${branding}, ~{::footerText})}">
                    <td>
                        <span th:fragment="footerText">
                            <span th:text="#{email.credential-offer.footer}">If you did not request this, please ignore this email or contact our</span>
                            <a th:href="${branding.supportUrl}" target="_blank" style="color: #2D58A7; text-decoration: underline;"
                               th:text="#{email.credential-offer.support}">support team</a>.
                        </span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

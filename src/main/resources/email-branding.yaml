# ---------------------------------------------------------------------------
# Email branding data (support / knowledge-base links, social links).
#
# Images are NOT configured here. They follow a fixed naming convention under the assets root
# (email-branding.assets-base-url, application.yml):
#   <assets-base-url>/<folder>/email/logo.png
#   <assets-base-url>/<folder>/email/header-bg.png
# <folder> is the tenant id when the tenant has a block below, else email-branding.default-folder.
# To brand a new tenant: upload its email/logo.png + email/header-bg.png to eudistack-platform-assets
# (tenants/<tenant-id>/email/) and add its block here.
#
# Link fields a tenant does not define are inherited from `default`. Social-link icons are common:
# <default-folder>/email/icons/<type>.png (types: github, linkedin).
# ---------------------------------------------------------------------------
email-branding:
  default:
    # TODO: real EUDIStack support URL (email-ui-refactor plan, section 8.7)
    support-url: https://example.invalid/support
    knowledge-base-url: https://docs.eudistack.net/
    social-links: []
  tenants:
    dome:
      support-url: https://ticketing.dome-marketplace.eu/
      # TODO: real DOME GitHub / LinkedIn URLs (email-ui-refactor plan, section 8.9)
      social-links:
        - { type: github, url: "https://github.com/TODO" }
        - { type: linkedin, url: "https://www.linkedin.com/TODO" }
